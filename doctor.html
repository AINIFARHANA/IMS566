<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Lunara Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #01357a; 
            --primary-dark: #002a63;
            --secondary: #EBF5FB; 
            --text-dark: #2d3436;
            --text-light: #636e72;
            --white: #ffffff;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Times New Roman', sans-serif; 
            background-color: #f0f2f5;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- Sidebar & Layout --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(180deg, #01357a 0%, #002a63 100%);
            color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            width: 70px;
            height: 70px;
            background: var(--secondary);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .sidebar-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .clinic-name { font-weight: 800; font-size: 20px; letter-spacing: 0.5px; }
        .clinic-tagline { font-size: 13px; opacity: 0.8; font-weight: 600; }

        .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #ffffff; 
            transform: translateX(5px);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px 30px;
            transition: all 0.3s;
        }

        .top-header {
            background: var(--white);
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .mobile-toggle {
            display: none; 
            background: var(--primary);
            border: none;
            color: white;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1002;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .content-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            padding: 25px;
            height: 100%;
            border: 1px solid #f0f0f0;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            background: #f8f9fa;
        }
        
        .form-control:focus, .form-select:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(1, 53, 122, 0.1);
        }

        .btn-primary-custom {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            width: 100%;
            transition: transform 0.2s;
        }
        
        .btn-primary-custom:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            color: white;
        }

        .table-custom thead th {
            background-color: var(--secondary);
            color: var(--primary);
            font-weight: 700;
            border: none;
            padding: 15px;
        }
        
        .table-custom tbody td {
            padding: 15px;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
            color: var(--text-dark);
            font-weight: 600;
        }

        .btn-fancy {
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            color: white;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #01357a, #2e5bb8);
            box-shadow: 0 5px 15px rgba(1, 53, 122, 0.3);
        }

        .btn-fancy:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(1, 53, 122, 0.5);
        }

        .btn-fancy::after {
            content: "";
            position: absolute;
            width: 300%;
            height: 300%;
            top: 50%;
            left: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.6s ease;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
        }

        .btn-fancy:active::after {
            transform: translate(-50%, -50%) scale(1);
            opacity: 0;
        }

        .btn-cancel {
            background: linear-gradient(135deg, #782a09, #be0d0d);
            box-shadow: 0 5px 15px rgba(254, 229, 229, 0.892);
        }

        .btn-cancel:hover {
            box-shadow: 0 8px 20px rgba(14, 61, 102, 0.5);
        }

        .btn-update {
            background: linear-gradient(135deg, #1292f3, #16035c);
            box-shadow: 0 5px 15px rgba(243,156,18,0.4);
        }

        .btn-update:hover {
            box-shadow: 0 8px 20px rgba(119, 87, 225, 0.6);
        }

        .avatar-circle {
            width: 40px; height: 40px;
            background: var(--secondary);
            color: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            margin-right: 10px;
        }

        .badge { padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }

        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
        }
        .custom-toast {
            background: white; border-left: 4px solid var(--primary);
            padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease-out; min-width: 250px;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 991px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
    <div style="position: fixed; top: 15px; left: 15px; z-index: 1002;">
        <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <!-- Sidebar -->
     <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="image/logo.png" alt="Lunara Clinic Logo">
            </div>
            <div class="clinic-name">Lunara Clinic</div>
            <div class="clinic-tagline">Healing with Care & Comfort</div>
        </div>

        <div class="nav flex-column">
            <a href="index.html" class="nav-link">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="patient.html" class="nav-link ">
                <i class="fas fa-user-injured"></i> Patients
            </a>
            <a href="doctor.html" class="nav-link active">
                <i class="fas fa-user-md"></i> Doctors
            </a>
            <a href="appointment.html" class="nav-link">
                <i class="fas fa-calendar-check"></i> Appointments
            </a>
            <a href="login.html" class="nav-link mt-auto">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div>
                <h2 style="color: var(--primary); font-weight: 800; margin: 0;">Doctor Management</h2>
                <p style="color: var(--text-light); margin: 0; font-weight: 600;">Manage Doctors Data</p>
            </div>
            <div class="user-info d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold" style="color: var(--primary);">Dr. Farhana</div>
                    <div class="small text-muted">Neurology</div>
                </div>
            </div>
        </header>

        <div class="container-fluid p-0">
            
            <div class="row g-4">
                
                <!-- Add or Edit Doctor Form -->
                <div class="col-lg-4">
                    <div class="content-card">
                        <h5 class="fw-bold mb-4" style="color: var(--primary);" id="formTitle">
                            <i class="fas fa-user-plus me-2"></i>Add New Doctor
                        </h5>
                        <form id="addDoctorForm">
                            <input type="hidden" id="docId">

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Doctor Name</label>
                                <input type="text" class="form-control" id="docName" placeholder="Doctor Name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Specialization</label>
                                <select class="form-select" id="docSpec" required>
                                    <option value="" selected disabled>Select specialization...</option>
                                    <option value="Cardiology">Cardiology</option>
                                    <option value="Neurology">Neurology</option>
                                    <option value="Pediatrics">Pediatrics</option>
                                    <option value="Dermatology">Dermatology</option>
                                    <option value="Nurse">Nurse</option>
                                    <option value="General Medicine">General Medicine</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Phone Number</label>
                                <input type="tel" class="form-control" id="docPhone" placeholder="+60 123456789" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Status</label>
                                <select class="form-select" id="docStatus">
                                    <option value="Available">Available</option>
                                    <option value="On Leave">On Leave</option>
                                </select>
                            </div>

                            <button type="submit" class="btn-fancy w-100 mb-2" id="submitBtn">
                                <i class="fas fa-plus me-2"></i>Add Doctor
                            </button>
                            
                            <button type="button" class="btn-fancy btn-cancel w-100 rounded-pill d-none" id="cancelBtn" onclick="resetForm()">
                                Cancel Edit
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Doctor List -->
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="row mb-4 g-3">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 bg-light" id="searchInput" placeholder="Search by name...">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <select class="form-select bg-light" id="filterSpec">
                                    <option value="All">All Specializations</option>
                                    <option value="Cardiology">Cardiology</option>
                                    <option value="Neurology">Neurology</option>
                                    <option value="Pediatrics">Pediatrics</option>
                                    <option value="Dermatology">Dermatology</option>
                                    <option value="Nurse">Nurse</option>
                                    <option value="General Medicine">General Medicine</option>
                                </select>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="table-responsive">
                            <table class="table table-hover table-custom align-middle">
                                <thead>
                                    <tr>
                                        <th>Doctor Name</th>
                                        <th>Specialization</th>
                                        <th>Phone</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="doctorTableBody">
                                </tbody>
                            </table>
                        </div>
                        
                        <div id="emptyState" class="text-center py-5 d-none">
                            <i class="fas fa-user-md fa-3x text-muted mb-3 opacity-50"></i>
                            <p class="text-muted fw-bold">No doctors found.</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let doctors = [
        {
            id: 1,
            name: "Dr. Farhana",
            spec: "Neurology",
            phone: "+60 12 555 0199",
            status: "Available"
        },
        {
            id: 2,
            name: "Dr. Ahmad Razif",
            spec: "General Medicine",
            phone: "+60 13 888 2200",
            status: "Available"
        },
        {
            id: 3,
            name: "Dr. Nurul Hidayah",
            spec: "Pediatrics",
            phone: "+60 14 777 3344",
            status: "On Leave"
        }
    ];

        let editingId = null; 
        const form = document.getElementById('addDoctorForm');
        const tableBody = document.getElementById('doctorTableBody');
        const searchInput = document.getElementById('searchInput');
        const filterSpec = document.getElementById('filterSpec');
        const emptyState = document.getElementById('emptyState');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');
        const docIdInput = document.getElementById('docId');

        document.addEventListener('DOMContentLoaded', () => {
            renderDoctors();
        });


        function renderDoctors() {
            const searchTerm = searchInput.value.toLowerCase();
            const specFilter = filterSpec.value;

            const filteredDoctors = doctors.filter(doc => {
                const matchesName = doc.name.toLowerCase().includes(searchTerm);
                const matchesSpec = specFilter === 'All' || doc.spec === specFilter;
                return matchesName && matchesSpec;
            });

            tableBody.innerHTML = '';

            if (filteredDoctors.length === 0) {
                emptyState.classList.remove('d-none');
            } else {
                emptyState.classList.add('d-none');
                
                filteredDoctors.forEach(doc => {
                    const row = document.createElement('tr');
                    
                    const statusBadge = doc.status === 'Available' 
                        ? '<span class="badge bg-success">Available</span>' 
                        : '<span class="badge bg-danger">On Leave</span>';

                    const initials = doc.name.split(' ').map(n => n[0]).join('').substring(0,2);

                    row.innerHTML = `
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle">${initials}</div>
                                <div class="fw-bold text-dark">${doc.name}</div>
                            </div>
                        </td>
                        <td><span class="text-muted small fw-bold bg-light px-2 py-1 rounded">${doc.spec}</span></td>
                        <td class="text-muted small">${doc.phone}</td>
                        <td>${statusBadge}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary rounded-circle me-1" onclick="editDoctor(${doc.id})" title="Edit">
                                <i class="fas fa-pen small"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="deleteDoctor(${doc.id})" title="Delete">
                                <i class="fas fa-trash-alt small"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }

        // ---Add or Update Doctor ---
        function handleFormSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('docName').value;
            const spec = document.getElementById('docSpec').value;
            const phone = document.getElementById('docPhone').value;
            const status = document.getElementById('docStatus').value;

            if (editingId) {
                // Update existing
                const index = doctors.findIndex(doc => doc.id === editingId);
                if (index !== -1) {
                    doctors[index] = { id: editingId, name, spec, phone, status };
                    showToast('Updated', 'Doctor details updated successfully!', 'success');
                }
            } else {
                // Add New Doctor
                const newDoctor = {
                    id: Date.now(), 
                    name,
                    spec,
                    phone,
                    status
                };
                doctors.unshift(newDoctor); 
                showToast('Success', 'New doctor added successfully!', 'success');
            }
            renderDoctors();
            resetForm();
        }

        // --- Prepare Edit Mode ---
        window.editDoctor = function(id) {
            const doc = doctors.find(d => d.id === id);
            if (!doc) return;

            // Populate Form
            document.getElementById('docName').value = doc.name;
            document.getElementById('docSpec').value = doc.spec;
            document.getElementById('docPhone').value = doc.phone;
            document.getElementById('docStatus').value = doc.status;

            editingId = id;
            docIdInput.value = id;
            formTitle.innerHTML = '<i class="fas fa-edit me-2"></i>Edit Doctor';
            submitBtn.innerHTML = '<i class="fas fa-save me-2"></i>Update Doctor';
            submitBtn.classList.remove('btn-fancy');
            submitBtn.classList.add('btn-fancy', 'btn-update');
            submitBtn.style.color = 'white';
            cancelBtn.classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Delete Doctor ---
        window.deleteDoctor = function(id) {
            if(confirm('Are you sure you want to delete this doctor?')) {
                if (editingId === id) {
                    resetForm();
                }

                doctors = doctors.filter(doc => doc.id !== id);
                renderDoctors();
                showToast('Deleted', 'Doctor record removed.', 'error');
            }
        }

        window.resetForm = function() {
            form.reset();
            editingId = null;
            docIdInput.value = '';
            
            formTitle.innerHTML = '<i class="fas fa-user-plus me-2"></i>Add New Doctor';
            submitBtn.innerHTML = '<i class="fas fa-plus me-2"></i>Add Doctor';
            submitBtn.classList.add('btn-fancy');
            submitBtn.classList.remove('btn-update');
            submitBtn.style.color = ''; 
            cancelBtn.classList.add('d-none');
        }

        form.addEventListener('submit', handleFormSubmit);
        searchInput.addEventListener('input', renderDoctors);
        filterSpec.addEventListener('change', renderDoctors);

        function showToast(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            
            const icon = type === 'success' 
                ? '<i class="fas fa-check-circle text-success fa-lg"></i>' 
                : '<i class="fas fa-exclamation-circle text-danger fa-lg"></i>';
            
            if(type === 'error') toast.style.borderLeftColor = '#dc3545';

            toast.innerHTML = `
                ${icon}
                <div>
                    <div class="fw-bold">${title}</div>
                    <div class="small text-muted">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('active'); 
        }
    </script>
</body>
</html>
