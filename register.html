<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Lunara Clinic</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<main class="auth-wrapper">

<header class="auth-header">

    <div class="logo-container">
        <img src="image/logo.png" alt="Logo">
    </div>

    <h1 class="clinic-name">Lunara Clinic</h1>
    <p class="clinic-tagline">Healing with Care and Comfort</p>

</header>

<section class="forms-container">

<form class="auth-form" action="login.html" method="POST">

<h2 class="form-title">Create Account</h2>

    <div class="input-group">
        <input type="text" name="fullname" placeholder="Full Name" required>
        <i class="fas fa-user"></i>
    </div>

    <div class="input-group">
        <input type="email" name="email" placeholder="Email Address" required>
        <i class="fas fa-envelope"></i>
    </div>

    <div class="input-group">
        <input type="text" name="username" placeholder="Username" required>
        <i class="fas fa-user-circle"></i>
    </div>

    <div class="input-group">
        <input type="password" name="password" placeholder="Password" required>
        <i class="fas fa-lock"></i>
    </div>

    <div class="input-group">
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
        <i class="fas fa-lock"></i>
    </div>

    <button class="gooey-btn" type="submit">Register</button>

    <div class="switch-text">
        Already have an account?
        <a class="switch-link" href="login.html">Login</a>
    </div>

</form>

</section>

</main>
<div id="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
